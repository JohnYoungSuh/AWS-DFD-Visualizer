name: Splunk App CI/CD (IL5 Hardened)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  APP_NAME: AWS-DFD-Visualizer
  VERSION: "2.8.7"
  SPL_FILE: "AWS-DFD-Visualizer-2.8.7.spl"

jobs:
  # STAGE 1: Build, Security Scanning & AppInspect Validation
  security_and_validation:
    name: Security Scan & Local AppInspect
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Secret Scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          path: ./
          extra_args: --only-verified
        continue-on-error: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.0.0
        with:
          python-version: '3.9'

      - name: Python Security Scan (Bandit)
        run: |
          pip install bandit==1.8.0
          bandit -r . -x ./.venv,./node_modules,./dist -ll

      # Build the webpack bundle and package the .spl BEFORE AppInspect.
      # AppInspect requires a valid gzip-compressed Splunk app archive (.spl).
      # Passing app_path: . (repo root) causes it to inspect the Makefile and fail.
      - name: Install Dependencies
        run: npm install

      - name: Production Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build webpack bundle
        run: npm run build

      - name: Run Cypress Component Tests (drilldowns, exports, stencils)
        run: npm run test:cy

      - name: Package Splunk App (.spl) & Cryptographic Checksums
        run: |
          SPL_FILE="${APP_NAME}-${VERSION}.spl"
          mkdir -p dist/${APP_NAME}
          # Copy only standard Splunk app folders — no node_modules, src, or dev tooling
          cp -r appserver default metadata splunk-app-manifest.json dist/${APP_NAME}/ 2>/dev/null || true
          # Remove WSL artifacts and hidden files from staging area
          find dist/${APP_NAME} -name ".*" -type f -delete
          find dist/${APP_NAME} -name "*Zone.Identifier*" -type f -delete
          # Set AppInspect-required permissions: 755 dirs, 644 files
          find dist/${APP_NAME} -type d -exec chmod 755 {} +
          find dist/${APP_NAME} -type f -exec chmod 644 {} +
          chmod -R 755 dist/${APP_NAME}/bin 2>/dev/null || true
          # Create the tarball and generate cryptographic SHA-256 / SHA-512 hashes
          tar -czf ${SPL_FILE} -C dist ${APP_NAME}
          sha256sum ${SPL_FILE} > ${SPL_FILE}.sha256
          sha512sum ${SPL_FILE} > ${SPL_FILE}.sha512
          echo "SPL_FILE=${SPL_FILE}" >> $GITHUB_ENV
          echo "Packaged: ${SPL_FILE} (SHA-256: $(cat ${SPL_FILE}.sha256))"

      - name: Splunk AppInspect (Local CLI)
        uses: splunk/appinspect-cli-action@515d3746940c6c48c70f5e716ba22d1bd118506c # v2.18.0
        with:
          app_path: ${{ env.SPL_FILE }}
          result_file: appinspect-report.html

      - name: Upload Security Reports
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: security-reports
          path: |
            appinspect-report.html

      # Upload the validated .spl and checksums for Stage 2 to reuse (avoids double-build)
      - name: Upload Validated .spl and Checksums
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: validated-spl
          path: |
            ${{ env.SPL_FILE }}
            ${{ env.SPL_FILE }}.sha256
            ${{ env.SPL_FILE }}.sha512

  # STAGE 2: SBOM Generation (reuses the .spl validated in Stage 1)
  build_and_package:
    name: Build & Package (IL5 SBOM)
    needs: security_and_validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Download Validated .spl
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: validated-spl
          path: dist/

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.17.9
        with:
          path: dist/
          format: cyclonedx-json
          output-file: dist/bom.json

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: aws-dfd-visualizer-il5-package
          path: dist/

  # STAGE 3: Splunk Cloud API Validation (Release Gating)
  # This job only runs on main/master merges when secrets are available
  cloud_validation:
    name: Splunk Cloud API Validation
    needs: build_and_package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Download Package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: aws-dfd-visualizer-il5-package
          path: dist/

      # Placeholder: This requires SPLUNKBASE_USERNAME and SPLUNKBASE_PASSWORD secrets
      # - name: Splunk AppInspect (Cloud API)
      #   uses: splunk/appinspect-api-action@v1
      #   with:
      #     app_path: dist/AWS-DFD-Visualizer.spl
      #     splunkbase_username: ${{ secrets.SPLUNKBASE_USERNAME }}
      #     splunkbase_password: ${{ secrets.SPLUNKBASE_PASSWORD }}
